[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "local-fox"
version = "0.1.0"
description = "A harness for local AI models run with Ollama and the MCP tools of ollmcp-generic-tools"
requires-python = ">=3.11"
dependencies = ["ollama>=0.6", "mcp>=2.1,<3"]

[project.optional-dependencies]
ui = ["PySide6>=6.8", "markdown>=3.6"]

[project.gui-scripts]
local-fox = "local_fox.ui.app:main"

[tool.setuptools]
packages = ["local_fox", "local_fox.ui"]

[tool.setuptools.package-data]
# The project instructions template that the setup writes into a project
local_fox = ["templates/*"]
